<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Directories Admin - Login Required</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600&display=swap');
        
        body {
            font-family: 'Open Sans', sans-serif;
        }
        
        h1, h2, h3 {
            font-family: 'Merriweather', serif;
        }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ IMPORTANT: Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'https://hsrjdbhovbwbfvyyridm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzcmpkYmhvdmJ3YmZ2eXlyaWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNTIwMzAsImV4cCI6MjA4NTcyODAzMH0.StKmidTLySiLJjZWZrAl4qcL2290Cy40LI1LAmmLnUg';


        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const commonEmojis = [
            "🌾", "🌽", "🐄", "🐖", "🐔", "🥬", "🥕", "🍎", "🍇", "🥩",
            "🧈", "🥛", "🍯", "🌻", "🌱", "🚜", "🏪", "🏞️", "🗺️", "📍"
        ];

        function EmojiPicker({ onSelect, currentEmoji }) {
            const [showPicker, setShowPicker] = useState(false);

            return (
                <div className="relative">
                    <button
                        type="button"
                        onClick={() => setShowPicker(!showPicker)}
                        className="w-16 h-16 text-3xl border-2 border-gray-300 rounded-lg hover:border-amber-500 flex items-center justify-center bg-white transition-colors"
                    >
                        {currentEmoji || "➕"}
                    </button>
                    {showPicker && (
                        <div className="absolute z-[9999] mt-2 p-4 bg-white rounded-lg shadow-2xl border-2 border-gray-200 w-80 left-0">
                            <div className="grid grid-cols-8 gap-2 max-h-64 overflow-y-auto">
                                {commonEmojis.map((emoji, idx) => (
                                    <button
                                        key={idx}
                                        type="button"
                                        onClick={() => {
                                            onSelect(emoji);
                                            setShowPicker(false);
                                        }}
                                        className="text-2xl hover:bg-amber-100 p-2 rounded transition-colors w-10 h-10 flex items-center justify-center"
                                    >
                                        {emoji}
                                    </button>
                                ))}
                            </div>
                            <button
                                type="button"
                                onClick={() => setShowPicker(false)}
                                className="w-full mt-2 px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded transition-colors text-sm"
                            >
                                Close
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function PartnerForm({ partner, onSave, onCancel, isSaving }) {
            const [formData, setFormData] = useState(partner || {
                name: '',
                url: '',
                description: '',
                icon: '',
                category: 'Regional Farms'
            });

            const categories = [
                'Regional Farms', 'Nationwide Markets', 'Specialty Products',
                'Farm Markets', 'Organic Directories', 'Farmers Markets'
            ];

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(formData);
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Directory Name *
                        </label>
                        <input
                            type="text"
                            required
                            value={formData.name}
                            onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                            placeholder="Enter directory name"
                        />
                    </div>

                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Icon/Emoji *
                        </label>
                        <div className="flex items-center gap-4">
                            <EmojiPicker
                                currentEmoji={formData.icon}
                                onSelect={(emoji) => setFormData({ ...formData, icon: emoji })}
                            />
                            <span className="text-sm text-gray-500">Click to choose an emoji</span>
                        </div>
                    </div>

                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Website URL *
                        </label>
                        <input
                            type="url"
                            required
                            value={formData.url}
                            onChange={(e) => setFormData({ ...formData, url: e.target.value })}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                            placeholder="https://example.com"
                        />
                    </div>

                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Category *
                        </label>
                        <select
                            required
                            value={formData.category}
                            onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                        >
                            {categories.map(cat => (
                                <option key={cat} value={cat}>{cat}</option>
                            ))}
                        </select>
                    </div>

                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Description *
                        </label>
                        <textarea
                            required
                            value={formData.description}
                            onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                            rows="4"
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                            placeholder="Describe what this directory offers..."
                        />
                    </div>

                    <div className="flex gap-4 pt-4">
                        <button
                            type="submit"
                            disabled={isSaving}
                            className="flex-1 bg-amber-600 text-white px-6 py-3 rounded-lg hover:bg-amber-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
                        >
                            {isSaving ? 'Saving...' : (partner ? 'Update Directory' : 'Add Directory')}
                        </button>
                        <button
                            type="button"
                            onClick={onCancel}
                            disabled={isSaving}
                            className="flex-1 bg-gray-300 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-400 transition-colors font-semibold disabled:bg-gray-200 disabled:cursor-not-allowed"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            );
        }

        function Modal({ isOpen, onClose, children, title }) {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                            <h2 className="text-2xl font-bold text-gray-800">{title}</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-500 hover:text-gray-700 text-2xl font-bold"
                            >
                                ×
                            </button>
                        </div>
                        <div className="p-6">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function AdminApp({ user, onLogout }) {
            const [partners, setPartners] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [editingPartner, setEditingPartner] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [error, setError] = useState(null);

            const loadPartners = async () => {
                try {
                    setLoading(true);
                    setError(null);
                    const { data, error } = await supabase
                        .from('partner_directories')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    setPartners(data || []);
                } catch (err) {
                    console.error('Error loading partners:', err);
                    setError(`Error loading data: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadPartners();
            }, []);

            const handleAddPartner = async (partnerData) => {
                try {
                    setIsSaving(true);
                    setError(null);
                    const { data, error } = await supabase
                        .from('partner_directories')
                        .insert([partnerData])
                        .select();

                    if (error) throw error;
                    
                    setPartners([data[0], ...partners]);
                    setShowModal(false);
                    alert('✅ Partner directory added successfully!');
                } catch (err) {
                    console.error('Error adding partner:', err);
                    alert(`Error: ${err.message}`);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleEditPartner = async (partnerData) => {
                try {
                    setIsSaving(true);
                    setError(null);
                    const { error } = await supabase
                        .from('partner_directories')
                        .update(partnerData)
                        .eq('id', editingPartner.id);

                    if (error) throw error;

                    setPartners(partners.map(p => 
                        p.id === editingPartner.id ? { ...partnerData, id: editingPartner.id, created_at: editingPartner.created_at } : p
                    ));
                    setEditingPartner(null);
                    setShowModal(false);
                    alert('✅ Partner directory updated successfully!');
                } catch (err) {
                    console.error('Error updating partner:', err);
                    alert(`Error: ${err.message}`);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDeletePartner = async (id) => {
                if (!confirm('Are you sure you want to delete this partner directory?')) return;

                try {
                    setError(null);
                    const { error } = await supabase
                        .from('partner_directories')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    setPartners(partners.filter(p => p.id !== id));
                    alert('✅ Partner directory deleted successfully!');
                } catch (err) {
                    console.error('Error deleting partner:', err);
                    alert(`Error: ${err.message}`);
                }
            };

            const openEditModal = (partner) => {
                setEditingPartner(partner);
                setShowModal(true);
            };

            const closeModal = () => {
                setShowModal(false);
                setEditingPartner(null);
            };

            const filteredPartners = partners.filter(p =>
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                p.description.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="loading-spinner mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading partner directories...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50">
                    <div className="bg-gradient-to-r from-amber-600 to-orange-600 py-8 px-4 shadow-lg">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <h1 className="text-4xl font-bold text-white mb-2">
                                        🔗 Partner Directories Admin
                                    </h1>
                                    <p className="text-amber-100 mb-2">
                                        Logged in as: {user.email}
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <a
                                        href="admin-authenticated.html"
                                        className="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition-colors text-sm"
                                    >
                                        ← Manage Businesses
                                    </a>
                                    <button
                                        onClick={onLogout}
                                        className="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition-colors"
                                    >
                                        🚪 Logout
                                    </button>
                                </div>
                            </div>
                            {error && (
                                <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mt-4">
                                    {error}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 py-8">
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <div className="flex flex-col md:flex-row gap-4 items-center justify-between mb-4">
                                <input
                                    type="text"
                                    placeholder="Search partner directories..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                                />
                                <button
                                    onClick={() => setShowModal(true)}
                                    className="bg-amber-600 text-white px-6 py-2 rounded-lg hover:bg-amber-700 transition-colors font-semibold flex items-center gap-2"
                                >
                                    <span className="text-xl">+</span> Add Partner Directory
                                </button>
                            </div>
                        </div>

                        <div className="text-gray-600 mb-4">
                            Total Partner Directories: {filteredPartners.length}
                        </div>

                        <div className="space-y-4">
                            {filteredPartners.map(partner => (
                                <div key={partner.id} className="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition-shadow border-l-4 border-amber-500">
                                    <div className="flex items-start gap-4">
                                        <div className="text-4xl">{partner.icon}</div>
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-gray-800 mb-2">{partner.name}</h3>
                                            <a 
                                                href={partner.url}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="text-amber-600 hover:text-amber-700 text-sm mb-2 inline-block"
                                            >
                                                {partner.url}
                                            </a>
                                            <p className="text-gray-600 text-sm mb-2">{partner.description}</p>
                                            <span className="inline-block bg-amber-100 text-amber-700 text-xs font-semibold px-3 py-1 rounded-full">
                                                {partner.category}
                                            </span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => openEditModal(partner)}
                                                className="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors text-sm"
                                            >
                                                ✏️ Edit
                                            </button>
                                            <button
                                                onClick={() => handleDeletePartner(partner.id)}
                                                className="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors text-sm"
                                            >
                                                🗑️ Delete
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {filteredPartners.length === 0 && !error && (
                            <div className="text-center py-12 bg-white rounded-xl shadow-md">
                                <p className="text-gray-500 text-xl">No partner directories found</p>
                                <p className="text-gray-400 text-sm mt-2">Click "Add Partner Directory" to get started!</p>
                            </div>
                        )}
                    </div>

                    <Modal
                        isOpen={showModal}
                        onClose={closeModal}
                        title={editingPartner ? 'Edit Partner Directory' : 'Add Partner Directory'}
                    >
                        <PartnerForm
                            partner={editingPartner}
                            onSave={editingPartner ? handleEditPartner : handleAddPartner}
                            onCancel={closeModal}
                            isSaving={isSaving}
                        />
                    </Modal>
                </div>
            );
        }

        function LoginPage({ onLoginSuccess }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;
                    onLoginSuccess(data.user);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">🔐 Partner Admin Login</h1>
                            <p className="text-gray-600">Manage Partner Directories</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    Email Address
                                </label>
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                                    placeholder="admin@example.com"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    required
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                                    placeholder="••••••••"
                                />
                            </div>

                            {error && (
                                <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-amber-600 text-white px-6 py-3 rounded-lg hover:bg-amber-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Logging in...' : 'Login'}
                            </button>
                        </form>

                        <p className="text-center text-sm text-gray-500 mt-6">
                            Same credentials as main admin panel
                        </p>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                    setLoading(false);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setUser(null);
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 flex items-center justify-center">
                        <div className="loading-spinner"></div>
                    </div>
                );
            }

            if (!user) {
                return <LoginPage onLoginSuccess={setUser} />;
            }

            return <AdminApp user={user} onLogout={handleLogout} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
