<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Directories - American Small Businesses</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600&display=swap');

        body {
            font-family: 'Open Sans', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Merriweather', serif;
        }

        .partner-card {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #fef7e7 0%, #fef0d8 100%);
            border-left: 4px solid #d4a574;
        }

        .partner-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 165, 116, 0.25);
            border-left-width: 6px;
        }

        .icon-container {
            background: linear-gradient(135deg, #d4a574 0%, #b8935f 100%);
        }

        .header-container {
            background: linear-gradient(135deg, #b8935f 0%, #d4a574 100%);
        }

        .loading-spinner {
            border: 3px solid #fef3c7;
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚠️ IMPORTANT: Replace these with your actual Supabase credentials
    const SUPABASE_URL = 'https://hsrjdbhovbwbfvyyridm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzcmpkYmhvdmJ3YmZ2eXlyaWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNTIwMzAsImV4cCI6MjA4NTcyODAzMH0.StKmidTLySiLJjZWZrAl4qcL2290Cy40LI1LAmmLnUg';

    // Initialize Supabase client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function PartnerCard({ partner }) {
        return (
            <div className="partner-card rounded-lg shadow-md p-5 border border-amber-200">
                <div className="flex items-start gap-3">
                    <div className="icon-container flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-md">
                        {partner.icon}
                    </div>
                    <div className="flex-1">
                        <div className="flex items-start justify-between gap-2 mb-2">
                            <h3 className="text-lg font-bold text-gray-800">{partner.name}</h3>
                            <span className="inline-flex items-center gap-1 bg-yellow-700 text-white text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap">
                                    🔗 Aggregator
                                </span>
                        </div>
                        <p className="text-gray-700 text-sm mb-3 leading-relaxed">{partner.description}</p>
                        <div className="flex items-center gap-3">
                            <a
                                href={partner.url.startsWith('http') ? partner.url : `https://${partner.url}`}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-1 text-yellow-800 hover:text-yellow-900 font-semibold text-sm transition-colors"
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                                Visit Directory
                            </a>
                            <span className="text-yellow-800 text-xs">•</span>
                            <span className="text-yellow-800 text-xs font-medium">{partner.category}</span>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    function App() {
        const [partners, setPartners] = useState([]);
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        // Load partners from Supabase
        useEffect(() => {
            const loadPartners = async () => {
                try {
                    setLoading(true);
                    setError(null);

                    if (SUPABASE_URL === 'YOUR_SUPABASE_URL_HERE' || SUPABASE_KEY === 'YOUR_SUPABASE_ANON_KEY_HERE') {
                        setError('⚠️ Supabase not configured. Please add your credentials to the code.');
                        setLoading(false);
                        return;
                    }

                    const { data, error } = await supabase
                        .from('partner_directories')
                        .select('*')
                        .order('name', { ascending: true });

                    if (error) throw error;
                    setPartners(data || []);
                } catch (err) {
                    console.error('Error loading partners:', err);
                    setError(`Error loading data: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            loadPartners();

            // Real-time subscription
            const subscription = supabase
                .channel('partner_directories_changes')
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'partner_directories' },
                    () => loadPartners()
                )
                .subscribe();

            return () => subscription.unsubscribe();
        }, []);

        const categories = useMemo(() => {
            const cats = ['All', ...new Set(partners.map(p => p.category))];
            return cats.sort();
        }, [partners]);

        const filteredPartners = useMemo(() => {
            return partners.filter(partner => {
                const matchesSearch = partner.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    partner.description.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = selectedCategory === 'All' || partner.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });
        }, [searchTerm, selectedCategory, partners]);

        if (loading) {
            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50">
                    <div className="header-container py-12 px-4 mb-8 shadow-lg">
                        <div className="max-w-5xl mx-auto text-center">
                            <div className="loading-spinner mx-auto mb-4"></div>
                            <p className="text-white">Loading partner directories...</p>
                        </div>
                    </div>
                </div>
            );
        }

        if (error) {
            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50">
                    <div className="header-container py-12 px-4 mb-8 shadow-lg">
                        <div className="max-w-5xl mx-auto">
                            <div className="bg-red-100 border border-red-400 text-red-700 px-6 py-4 rounded-lg">
                                <p className="font-semibold mb-2">Error Loading Data</p>
                                <p>{error}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        return (
            <div className="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50">
                {/* Header */}
                <div className="header-container py-12 px-4 mb-8 shadow-lg">
                    <div className="max-w-5xl mx-auto">
                        {/* Back to Main Directory Link */}
                        <a
                            href="index.html"
                            className="inline-flex items-center gap-2 text-amber-100 hover:text-white transition-colors mb-6 text-sm"
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            Back to Main Directory
                        </a>

                        <h1 className="text-4xl md:text-5xl font-bold text-white text-center mb-4">
                            🔗 Partner Directories
                        </h1>
                        <p className="text-stone-100 text-center mb-8 text-lg max-w-3xl mx-auto">
                            Explore these trusted aggregators and directories to discover even more American farms, businesses, and local products
                        </p>

                        <div className="flex flex-col md:flex-row gap-4">
                            <input
                                type="text"
                                placeholder="Search directories..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="flex-1 px-6 py-3 rounded-full border-2 border-white/20 bg-white/10 backdrop-blur-sm text-white placeholder-amber-200 focus:outline-none focus:border-white focus:bg-white/20 transition-all"
                            />
                            <select
                                value={selectedCategory}
                                onChange={(e) => setSelectedCategory(e.target.value)}
                                className="px-6 py-3 rounded-full border-2 border-white/20 bg-white/10 backdrop-blur-sm text-white focus:outline-none focus:border-white focus:bg-white/20 transition-all"
                            >
                                {categories.map(cat => (
                                    <option key={cat} value={cat} className="text-gray-900">
                                        {cat}
                                    </option>
                                ))}
                            </select>
                        </div>

                        <div className="text-center mt-4 text-amber-100">
                            Showing {filteredPartners.length} of {partners.length} partner directories
                        </div>
                    </div>
                </div>

                {/* Info Banner */}
                <div className="max-w-5xl mx-auto px-4 mb-8">
                    <div className="bg-yellow-50 border-l-4 border-yellow-600 p-4 rounded">
                        <div className="flex items-start gap-3">
                            <svg className="w-6 h-6 text-yellow-700 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <div>
                                <p className="font-semibold text-yellow-900 mb-1">What are Partner Directories?</p>
                                <p className="text-yellow-800 text-sm">
                                    These aggregator sites collect and list multiple farms, markets, and businesses in one place.
                                    They're great resources for finding local products beyond our direct listings.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Partner Cards */}
                <div className="max-w-5xl mx-auto px-4 pb-12">
                    <div className="space-y-4">
                        {filteredPartners.map(partner => (
                            <PartnerCard key={partner.id} partner={partner} />
                        ))}
                    </div>

                    {filteredPartners.length === 0 && (
                        <div className="text-center py-12 bg-white rounded-xl shadow-md">
                            <p className="text-gray-500 text-xl">No partner directories found</p>
                            <p className="text-gray-400 text-sm mt-2">Try adjusting your search or filters</p>
                        </div>
                    )}
                </div>

                {/* Footer */}
                <footer className="bg-stone-800 text-white py-8 mt-12">
                    <div className="max-w-5xl mx-auto px-4 text-center">
                        <p className="text-stone-200">
                            Looking for direct business listings? <a href="index.html" className="text-white font-semibold hover:underline">Visit Main Directory →</a>
                        </p>
                        <p className="text-stone-300 text-sm mt-2">
                            Partner Directories • Connecting you with American businesses
                        </p>
                    </div>
                </footer>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
